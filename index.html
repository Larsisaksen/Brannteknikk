<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brannrapport</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="card">
        <h1>Brannrapport</h1>
      </div>

      <div class="card">
        <h2>Grunninformasjon</h2>
        <div class="row2">
          <div>
            <label>Virksomhet / bygg</label>
            <input id="buildingName" placeholder="F.eks. Sameiet Stadionbygg" />
          </div>
          <div>
            <label>Dato</label>
            <input id="inspectionDate" type="date" />
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Eier</label>
            <input id="owner" placeholder="Eier" />
          </div>
          <div>
            <label>Eiers representant</label>
            <input id="ownerRep" placeholder="Navn" />
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Adresse</label>
            <input id="address" placeholder="Adresse" />
          </div>
          <div>
            <label>Ant. leietakere / brukere</label>
            <input id="tenants" placeholder="F.eks. 6" />
          </div>
        </div>

        <div class="row3">
          <div>
            <label>Type bygning</label>
            <input id="buildingType" placeholder="Kontor / lager / handel" />
          </div>
          <div>
            <label>Areal</label>
            <input id="area" placeholder="2300 KVM" />
          </div>
          <div>
            <label>Objekt</label>
            <input id="objectRef" placeholder="A" />
          </div>
        </div>

        <div class="row3">
          <div>
            <label>Brannklasse</label>
            <input id="fireClass" placeholder="1" />
          </div>
          <div>
            <label>Risikoklasse</label>
            <input id="riskClass" placeholder="5" />
          </div>
          <div>
            <label>TEK</label>
            <input id="tek" placeholder="87/10" />
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Brannkonsept</label>
            <select id="docConcept">
              <option>Ja</option>
              <option selected>Nei</option>
              <option>Delvis</option>
            </select>
            <textarea id="docConceptNotes" placeholder="Kommentar (valgfritt)"></textarea>
          </div>
          <div>
            <label>Branntekniske tegninger</label>
            <select id="docDrawings">
              <option>Ja</option>
              <option>Nei</option>
              <option selected>Delvis</option>
            </select>
            <textarea id="docDrawingsNotes" placeholder="Kommentar (valgfritt)"></textarea>
          </div>
        </div>

        <div>
          <label>Forsidebilde</label>
          <input id="coverImage" type="file" accept="image/*" />
        </div>
      </div>

      <div class="card">
        <h2>Velg kontrollpunkter</h2>
        <div class="small muted">
          Brukeren velger først hvilke punkter som skal kontrolleres. Deretter vises kun tilhørende skjemaer lenger ned.
        </div>
        <div id="moduleOptions" class="moduleGrid"></div>
      </div>

      <div class="card">
        <h2>Valgte skjemaer</h2>
        <div id="moduleForms"></div>
        <div class="btnRow">
          <button id="updateReportBtn" class="btnPrimary">Oppdater rapport</button>
          <button id="fillDemoBtn" class="btnSecondary">Fyll eksempeldata</button>
          <button id="printBtn" class="btnGhost">Lagre som PDF</button>
          <button id="resetBtn" class="btnGhost">Tøm alt</button>
        </div>
      </div>
    </aside>

    <main class="previewWrap">
      <div id="pages"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
